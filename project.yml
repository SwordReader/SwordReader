name: SwordReader
options:
  bundleIdPrefix: com.orbeavers14
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
packages:
  BibleKit:
    url: https://github.com/SwordReader/BibleKit.git
    exactVersion: 0.3.0
  BibleUI:
    url: https://github.com/SwordReader/BibleUI.git
    exactVersion: 0.2.0
  SwordKit:
    url: https://github.com/orbeavers14/SwordKit.git
    exactVersion: 0.6.1
targetTemplates:
  SwordReaderApp:
    type: application
    sources:
      - path: SwordReader
    dependencies:
      - package: BibleKit
        product: BibleKit
      - package: BibleKit
        product: BibleKitSword
      - package: BibleUI
        product: BibleUI
      - package: SwordKit
        product: SwordKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: SwordReader
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.orbeavers14.SwordReader.read
            CFBundleURLSchemes:
              - swordreader
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHumanReadableCopyright: "SwordReader is licensed under GPL-2.0-only. Bible modules have separate licenses."
        NSUserActivityTypes:
          - com.orbeavers14.SwordReader.reading
targets:
  SwordReader:
    templates: [SwordReaderApp]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbeavers14.SwordReader
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: SwordReaderWatch
        embed: true
  SwordReaderMac:
    templates: [SwordReaderApp]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbeavers14.SwordReader.mac
  SwordReaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SwordReaderTests
    dependencies:
      - target: SwordReaderMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbeavers14.SwordReaderTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
  SwordReaderWatch:
    type: application
    platform: watchOS
    sources:
      - path: SwordReaderWatch
    dependencies:
      - package: SwordKit
        product: SwordKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbeavers14.SwordReader.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/SwordReaderWatch-Info.plist
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  SwordReader:
    build:
      targets:
        SwordReader: all
    run:
      config: Debug
  SwordReader-macOS:
    build:
      targets:
        SwordReaderMac: all
        SwordReaderTests: [test]
    run:
      config: Debug
    test:
      gatherCoverageData: true
      targets:
        - SwordReaderTests
  SwordReader-watchOS:
    build:
      targets:
        SwordReaderWatch: all
    run:
      config: Debug
